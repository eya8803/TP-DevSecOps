name: CI/CD - democyber

# Déclenche le workflow sur push ou pull request vers main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # nécessaire pour que Gitleaks analyse l'historique

      # Installer Java
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gitleaks scan (before compilation)
      - name: Run Gitleaks scan
        uses: zricethezav/gitleaks-action@v2

      # Upload the Gitleaks report
      - name: Upload Gitleaks report
        if: always()   # uploadé même si Gitleaks échoue
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif

      # Compiler le code Java
      - name: Compile Java
        run: mvn compile

      # Construire le projet avec Maven
      - name: Build Java project with Maven
        run: mvn clean package

      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME .

      # Test Docker image
      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 $DOCKER_IMAGE_NAME
          sleep 10
          docker logs democyber-test
          curl -f http://localhost:8080 || echo "App not responding"
          docker stop democyber-test
          docker rm democyber-test

      - name: Show image details
        run: docker images $DOCKER_IMAGE_NAME

      # ===== BLOC AJOUTÉ : Trivy scan (Partie II, étape 2) =====
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        if: always()   # uploadé même si Trivy fait échouer le pipeline
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
      # =========================================================

      # ===== Partie III : Push sur Docker Hub =====
      - name: Push Docker image
        run: docker push $DOCKER_IMAGE_NAME